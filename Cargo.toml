[package]
name = "vpanel"
version = "1.3.0"
edition = "2021"
description = "vPanel: a tiny, low-memory HTTP dashboard panel with YAML config, built in pure Rust."

[[bin]]
name = "vpanel"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
# Web 终端（PTY + WebSocket）
portable-pty = "0.8"
sha1 = "0.10"
base64 = "0.22"
# 内置 HTTPS：TLS 终结（自签 / 已有证书），对齐 iotapanel 的 https-front。
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2"
rcgen = { version = "0.13", default-features = false, features = ["ring"] }

[profile.release]
# 尽力把二进制和常驻内存压到最小
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true