[package]
name = "vpanel"
version = "1.4.1"
edition = "2021"
description = "vPanel: a tiny, low-memory HTTP dashboard panel with YAML config, built in pure Rust."

[[bin]]
name = "vpanel"
path = "src/main.rs"

[features]
# 默认精简构建：不内链 rustls/ring/rcgen（TLS）与 portable-pty（Web 终端），
# 把常驻内存压到最低。需要时用特性开启：
#   cargo build --release --features tls        # 内置 HTTPS
#   cargo build --release --features terminal    # Web 终端（浏览器内 Shell）
#   cargo build --release --features tls,terminal # 全功能
default = []
tls = ["dep:rustls", "dep:rustls-pemfile", "dep:rcgen"]
terminal = ["dep:portable-pty"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
# Web 终端（PTY + WebSocket）——可选特性，默认不含（省便携 PTY 依赖体积）。
portable-pty = { version = "0.8", optional = true }
sha1 = "0.10"
base64 = "0.22"
# 运维工具箱（密码/随机、哈希、UUID）
rand = "0.8"
sha2 = "0.10"
# 内置 HTTPS：TLS 终结（自签 / 已有证书），对齐 iotapanel 的 https-front。
# 可选特性（默认不含，省 ring 汇编代码段，显著降低常驻内存）。
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"], optional = true }
rustls-pemfile = { version = "2", optional = true }
rcgen = { version = "0.13", default-features = false, features = ["ring"], optional = true }

[profile.release]
# 尽力把二进制和常驻内存压到最小
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true