[package]
name = "vpanel"
version = "1.6.1"
edition = "2021"
description = "vPanel: a tiny, low-memory HTTP dashboard panel with YAML config, built in pure Rust."

[[bin]]
name = "vpanel"
path = "src/main.rs"

[features]
# 默认精简构建：内链 Web 终端（portable-pty），TLS 保持可选。
# 需要 HTTPS 时再加：
#   cargo build --release --features tls        # 内置 HTTPS + 加密 SMTP 邮件告警
#   cargo build --release --features tls,terminal # TLS + 终端（全功能）
default = ["terminal"]
tls = ["dep:rustls", "dep:rustls-pemfile", "dep:rcgen", "dep:webpki-roots"]
terminal = ["dep:portable-pty"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
# Web 终端（PTY + WebSocket）——可选特性，默认不含（省便携 PTY 依赖体积）。
portable-pty = { version = "0.8", optional = true }
sha1 = "0.10"
base64 = "0.22"
# 运维工具箱（密码/随机、哈希、UUID）
rand = "0.8"
sha2 = "0.10"
# 内置 HTTPS：TLS 终结（自签 / 已有证书），对齐 iotapanel 的 https-front。
# 可选特性（默认不含，省 ring 汇编代码段，显著降低常驻内存）。
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"], optional = true }
rustls-pemfile = { version = "2", optional = true }
rcgen = { version = "0.13", default-features = false, features = ["ring"], optional = true }
# 内置根证书，供 SMTP 邮件的 STARTTLS / SMTPS 校验服务器证书（tls 特性下启用）。
webpki-roots = { version = "0.26", optional = true }

[profile.release]
# 尽力把二进制和常驻内存压到最小
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true