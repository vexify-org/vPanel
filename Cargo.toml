[package]
name = "vpanel"
version = "0.1.0"
edition = "2021"
description = "vPanel: a tiny, low-memory HTTP dashboard panel with YAML config, built in pure Rust."

[[bin]]
name = "vpanel"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
# Web 终端（PTY + WebSocket）
portable-pty = "0.8"
sha1 = "0.10"
base64 = "0.22"

[profile.release]
# 尽力把二进制和常驻内存压到最小
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true