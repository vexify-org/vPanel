# ========================================================= =
#  清亮面板 (vPanel) 配置示例
#  通过 serde_yaml 解析，全部字段均有默认值。
# ========================================================= =
server:
  bind: "0.0.0.0"        # 监听地址
  port: 8080              # 监听端口
  workers: 1              # 固定工作线程数（高并发时内存受此约束而不会暴涨）
  backlog: 1024           # 待处理连接队列上限，超过即拒绝，保证内存有界

panel:
  title: "vPanel"
  subtitle: "极简 · 低内存 HTTP 面板"
  accent: "#2563eb"       # 主题强调色
  theme: "light"          # light | dark

shell:                     # Web 终端（浏览器内本地 Shell 控制）
  enabled: true
  cmd: "/bin/sh"           # 可改为 /bin/bash
  args: []                 # 附加参数，如 ["-l"]
  columns: 100
  rows: 30

security:                  # 登录保护。未配置本段时默认开启（fail-closed）。
  enabled: true            # 首次启动未设密码会进入初始设置向导。
  # password: "请用向导设置，勿明文写入此文件"
  # mcp_token: ""          # MCP 独立 Bearer 令牌（可选）
  max_failures: 5          # 连续失败锁定阈值
  lock_minutes: 5          # 锁定时长（分钟）
  single_session: true     # 新登录踢掉旧会话

download:                  # 软件商店：加速前缀 + 清单仓库
  accel: "https://g.z321.cc.cd/"          # 全局下载加速前缀
  store: "vexify-org/vp-store@main"        # 清单仓库（owner/repo@branch）

plugins:
  dir: "plugins"            # 插件目录（相对运行目录），放 *.yml 即自动加载