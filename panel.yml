# ========================================================= =
#  清亮面板 (lumen panel) 配置示例
#  通过 serde_yaml 解析，全部字段均有默认值。
# ========================================================= =
server:
  bind: "0.0.0.0"        # 监听地址
  port: 8080              # 监听端口
  workers: 4              # 固定工作线程数（高并发时内存受此约束而不会暴涨）
  backlog: 1024           # 待处理连接队列上限，超过即拒绝，保证内存有界

panel:
  title: "Lumen Panel"
  subtitle: "极简 · 低内存 HTTP 面板"
  accent: "#2563eb"       # 主题强调色
  theme: "light"          # light | dark