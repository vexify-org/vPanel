name: net_softirq
version: 1.0.0
desc: "网络软中断诊断"
url: plugins/net_softirq.yml

tools:
    - id: softirq
      desc: "各 CPU 软中断计数"
      script: |
        grep -E 'NET_RX|NET_TX|^CPU' /proc/softirqs 2>/dev/null
    - id: retrans
      desc: "TCP 重传计数"
      script: |
        cat /proc/net/snmp | awk '/^Tcp:/{getline; print "active="$3, "retrans="$22, "loss="$23}'
    - id: overflows
      desc: "监听队列溢出统计"
      script: |
        nstat -az 2>/dev/null | grep -iE 'ListenOverflows|TCPBacklogDrop' || echo 需iproute2
