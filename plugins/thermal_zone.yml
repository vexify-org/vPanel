name: thermal_zone
version: 1.0.0
desc: "内核热区温度诊断"
url: plugins/thermal_zone.yml

tools:
    - id: temperatures
      desc: "各热区当前温度"
      script: |
        for z in /sys/class/thermal/thermal_zone*; do [ -e $z/temp ] && echo "$(basename $z) type=$(cat $z/type 2>/dev/null) temp=$(awk '{print $1/1000"C"}' $z/temp)"; done 2>/dev/null
    - id: trip
      desc: "热区触发温度"
      script: |
        for z in /sys/class/thermal/thermal_zone*; do [ -e $z/trip_point_0_temp ] && echo "$(basename $z) trip0=$(awk '{print $1/1000"C"}' $z/trip_point_0_temp)"; done 2>/dev/null
    - id: cooling
      desc: "冷却设备状态"
      script: |
        for c in /sys/class/thermal/cooling_device*; do echo "$(basename $c): $(cat $c/type 2>/dev/null) $(cat $c/cur_state 2>/dev/null)/$(cat $c/max_state 2>/dev/null)"; done 2>/dev/null | head -20
