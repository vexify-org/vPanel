name: audit_rules
version: 1.0.0
desc: "内核审计(Audit)规则诊断"
url: plugins/audit_rules.yml

tools:
    - id: rules
      desc: "已配置审计规则"
      script: |
        auditctl -l 2>/dev/null || cat /etc/audit/audit.rules 2>/dev/null | grep -vE '^#|^$' | head -30 || echo 未安装auditd
    - id: status
      desc: "审计状态"
      script: |
        auditctl -s 2>/dev/null || echo 未启用审计
    - id: log
      desc: "审计日志最近条目"
      script: |
        tail -20 /var/log/audit/audit.log 2>/dev/null || echo 无审计日志
