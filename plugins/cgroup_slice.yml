name: cgroup_slice
version: 1.0.0
desc: "cgroup 资源组诊断"
url: plugins/cgroup_slice.yml

tools:
    - id: slices
      desc: "systemd 资源组"
      script: |
        systemd-cgtop --iterations=1 2>/dev/null | head -20 || echo 需systemd-cgtop
    - id: mem_current
      desc: "当前 cgroup 内存"
      script: |
        cat /sys/fs/cgroup/memory.current 2>/dev/null | awk '{print "当前内存="$1/1024/1024"MB"}'
    - id: cpu_usage
      desc: "当前 cgroup CPU"
      script: |
        cat /sys/fs/cgroup/cpu.stat 2>/dev/null | head -5
