name: conn_perf
version: 1.0.0
desc: "连接性能与压力诊断"
url: plugins/conn_perf.yml

tools:
    - id: estab
      desc: "已建立连接数"
      script: |
        ss -tan 2>/dev/null | grep -c ESTAB
    - id: timewait
      desc: "TIME_WAIT 状态数"
      script: |
        ss -tan 2>/dev/null | grep -c TIME-WAIT
    - id: ephemeral
      desc: "本地端口范围"
      script: |
        cat /proc/sys/net/ipv4/ip_local_port_range
