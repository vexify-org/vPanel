# vPanel 插件：临时目录占用
name: tmp_usage
version: 1.0.0
desc: 查看 /tmp /var/tmp 目录占用与文件数
url: plugins/tmp_usage.yml

tools:
  - id: usage
    desc: 返回临时目录大小与文件数
    script: |
      out = cmd("du -sh /tmp /var/tmp 2>/dev/null; echo 文件数:; find /tmp /var/tmp -type f 2>/dev/null | wc -l")
      ret("临时目录占用：\n" + out)