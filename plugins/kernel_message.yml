name: kernel_message
version: 1.0.0
desc: "内核消息风暴诊断"
url: plugins/kernel_message.yml

tools:
    - id: rate
      desc: "近期内核消息速率"
      script: |
        dmesg 2>/dev/null | wc -l | awk '{print "内核log条数="$1}' || echo 需root
    - id: repeats
      desc: "重复消息统计"
      script: |
        dmesg 2>/dev/null | tail -200 | sort | uniq -c | sort -rn | head -12 || echo 需root
    - id: warn
      desc: "内核警告"
      script: |
        dmesg 2>/dev/null | grep -iE 'WARNING|BUG:' | tail -10 || echo 需root或无告警
