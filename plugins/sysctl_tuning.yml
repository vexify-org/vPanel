# vPanel 插件：内核调优参数
name: sysctl_tuning
version: 1.0.0
desc: 查看与网络/性能相关的关键内核参数
url: plugins/sysctl_tuning.yml

tools:
  - id: net
    desc: 返回关键网络内核参数（缓冲/连接/文件数）
    script: |
      out = cmd("sysctl -n net.core.rmem_max net.core.wmem_max net.ipv4.tcp_syncookies net.ipv4.ip_local_port_range fs.file-max 2>/dev/null")
      ret("rmem_max/wmem_max/syncookies/port_range/file-max(逐行对应):\n" + out)