name: zfs_pool
version: 1.0.0
desc: "ZFS 存储池诊断"
url: plugins/zfs_pool.yml

tools:
    - id: pools
      desc: "ZFS 池状态"
      script: |
        zpool status 2>/dev/null || echo 未安装zfs
    - id: datasets
      desc: "ZFS 数据集与配额"
      script: |
        zfs list 2>/dev/null | head -30 || echo 未安装zfs
    - id: scrub
      desc: "ZFS 校验进度"
      script: |
        zpool status 2>/dev/null | grep -iE 'scan|scrub' || echo 未安装zfs
