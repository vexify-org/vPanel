# vPanel 插件：PHP-FPM 状态
name: php_fpm_status
version: 1.0.0
desc: 检查 PHP-FPM Pool 运行状态与请求统计
url: plugins/php_fpm_status.yml

tools:
  - id: status
    desc: 返回 PHP 版本与 fpm 进程数
    script: |
      v = cmd("php -v 2>/dev/null | head -1 || echo PHP未安装")
      pool = cmd("ps -eo comm 2>/dev/null | grep -c 'php-fpm'")
      st = cmd("curl -s http://127.0.0.1/status?full 2>/dev/null | grep -E 'active processes|listen queue|max children' | head -5 || echo 未配置status")
      ret("" + trim(v) + " / fpm 进程: " + trim(pool) + "\n" + trim(st))