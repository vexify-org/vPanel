# vPanel 软件商店 · 应用清单（约 1MB）
# 面板从此仓库实时拉取本文件（下载默认走加速前缀 g.z321.cc.cd）。
# {accel} 会在安装时被替换为实际加速前缀。
apps:
  - id: docker
    name: Docker Engine
    desc: Docker 容器运行时（get.docker.com 官方脚本，下载走加速）
    script: |
      curl -fsSL {accel}https://get.docker.com | sh
      systemctl enable --now docker
  - id: docker-compose
    name: Docker Compose
    desc: 多容器编排（官方二进制，arm64/x86_64 自动识别，走加速）
    script: |
      arch=$(uname -m)
      if [ "$arch" = aarch64 ]; then arch=aarch64; else arch=x86_64; fi
      curl -fsSL {accel}https://github.com/docker/compose/releases/latest/download/docker-compose-linux-${arch} -o /usr/local/bin/docker-compose
      chmod +x /usr/local/bin/docker-compose
  - id: nginx
    name: Nginx
    desc: 高性能 Web / 反向代理服务器（apt 源）
    script: |
      apt-get update -qq && apt-get install -y -qq nginx
      systemctl enable --now nginx
  - id: caddy
    name: Caddy
    desc: 自动 HTTPS 的 Web 服务器（官方二进制，走加速）
    script: |
      curl -fsSL {accel}https://caddyserver.com/api/download -o /usr/bin/caddy
      chmod +x /usr/bin/caddy
