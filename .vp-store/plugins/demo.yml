# vp-store 内置的 demo 插件（与本地插件目录一致）。
name: demo
version: 1.1.0
desc: 示例插件：条件/循环/比较、工具入参、KV 持久化、文本/数学函数、结构化返回
url: plugins/demo.yml

tools:
  - id: uptime
    desc: 显示系统运行时长（变量 + cmd + 拼接）
    script: |
      now = cmd("uptime -p")
      host = cmd("hostname")
      ret("主机 " + host + " 已运行 " + now)

  - id: greet
    desc: 用入参打招呼（arg 读取工具入参）
    params:
      - id: name
        name: 称呼
        type: string
        required: true
        desc: 你的名字
      - id: times
        name: 次数
        type: number
        required: false
        default: "1"
        desc: 循环打印次数
    script: |
      n = arg("times")
      if n == "" || n == "0"
        n = 1
      end
      out = ""
      for i in range(atoi(n))
        out = out + "你好，" + arg("name") + " (第" + itoa(i + 1) + "次)"
        if i < atoi(n) - 1
          out = out + "；"
        end
      end
      ret("问候: " + out)

  - id: counter
    desc: KV 计数器（kv_set/kv_get 持久化，重启不丢）
    script: |
      c = atoi(kv_get("count"))
      c = c + 1
      kv_set("count", itoa(c))
      ret("累计执行 " + itoa(c) + " 次")

  - id: analyze
    desc: 文本/数学函数演示，返回结构化 JSON（json()）
    script: |
      raw = arg("text")
      if raw == ""
        raw = "hello vpanel"
      end
      avg = round((1 + 2 + 3) / 3)
      upper = upper(raw)
      half = substr(raw, 0, 3)
      ret(json("len=" + itoa(len(raw)) + " upper=" + upper + " head=" + half + " avg=" + itoa(avg)))

tasks:
  - id: heartbeat
    every: 10
    desc: 每 10 秒打印一次心跳
    script: |
      t = cmd("date \"+%H:%M:%S\"")
      log("心跳 " + t)

hooks:
  - event: on_init
    script: |
      log("插件 demo 加载完成，on_init 已触发")